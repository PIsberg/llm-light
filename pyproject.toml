[build-system]
requires = ["setuptools>=84.2.1", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-light-cli"
version = "0.1.0"
description = "Interactive CLI chat tool for querying and editing a codebase with an LLM agent (Claude, Gemini via agy, Codex), using hybrid RAG and prompt caching."
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Peter Isberg", email = "isberg.peter+cl@gmail.com" }]
keywords = ["claude", "anthropic", "gemini", "codex", "rag", "llm", "cli", "code-search", "prompt-caching"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "sentence-transformers>=6.2.0",
    "numpy>=2.5.4",
    "watchdog>=7.0.0",
    "anthropic>=2.3.0",
    "certifi>=2026.10.23",
    "prompt_toolkit>=3.0.53",
    "rich>=15.0.0",
    "einops>=0.8.2",
    "tree-sitter>=0.26.0",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-rust>=0.24.2",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
]

[project.optional-dependencies]
llmlingua = ["llmlingua>=0.2.2"]
dev = [
    "build>=1.6.1",
    "hypothesis>=6.170.12",
    "pytest>=9.2.0",
]

[project.scripts]
llm-light = "llm_light.__main__:main"

[project.urls]
Homepage = "https://github.com/PIsberg/llm-light"
Repository = "https://github.com/PIsberg/llm-light"
Issues = "https://github.com/PIsberg/llm-light/issues"
Changelog = "https://github.com/PIsberg/llm-light/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["llm_light*"]
exclude = ["tests*", "scripts*", "installers*", "docs*"]
